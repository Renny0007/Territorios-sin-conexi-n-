<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Tactical Grid Lines -->
  <path d="M 64 128 H 448 M 64 256 H 448 M 64 384 H 448 M 128 64 V 448 M 256 64 V 448 M 384 64 V 448" 
        stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Polygon Territory Shape -->
  <polygon points="120,380 90,200 240,110 410,160 430,340 280,420" 
           fill="url(#polyGrad)" stroke="#10b981" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Polygon Vertices (Tactical nodes) -->
  <circle cx="120" cy="380" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="90" cy="200" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="240" cy="110" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="410" cy="160" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="430" cy="340" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="280" cy="420" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4"/>

  <!-- Crosshair center circle -->
  <circle cx="260" cy="260" r="64" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,8" opacity="0.4"/>

  <!-- GPS Pin with high-tech badge -->
  <g filter="url(#glow)">
    <path d="M260,190 C226.8,190 200,216.8 200,250 C200,295 260,360 260,360 C260,360 320,295 320,250 C320,216.8 293.2,190 260,190 Z" 
          fill="url(#pinGrad)" stroke="#ffffff" stroke-width="5"/>
    <circle cx="260" cy="250" r="22" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="260" cy="250" r="10" fill="#38bdf8"/>
  </g>
</svg>
